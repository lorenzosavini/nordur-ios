name: TestFlight

# Archives the app, signs it with automatic signing through an App Store
# Connect API key and uploads it to TestFlight. Run it by hand
# (Actions › TestFlight › Run workflow) after setting these repository secrets:
#   APPLE_TEAM_ID        10-character Team ID (developer.apple.com › Membership)
#   ASC_KEY_ID           App Store Connect API key ID
#   ASC_ISSUER_ID        Issuer ID shown above the API keys
#   ASC_PRIVATE_KEY      contents of the AuthKey_XXXX.p8 file
# The app record (bundle ID it.lorenzosavini.nordur) must exist in App Store Connect.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$TEAM" ] || [ -z "$KEY" ]; then
            echo "::error::Imposta i secret APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID e ASC_PRIVATE_KEY (vedi docs/INSTALLA.md)"; exit 1
          fi

      - name: API key
        env:
          P8: ${{ secrets.ASC_PRIVATE_KEY }}
          KEY: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$P8" > ~/private_keys/AuthKey_$KEY.p8

      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project Nordur.xcodeproj -scheme Nordur -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/Nordur.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY.p8 -authenticationKeyID "$KEY" -authenticationKeyIssuerID "$ISSUER" \
            archive | tail -40

      - name: Upload to TestFlight
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Nordur.xcarchive -exportPath build/export -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY.p8 -authenticationKeyID "$KEY" -authenticationKeyIssuerID "$ISSUER" | tail -40
