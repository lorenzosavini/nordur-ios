name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One run at a time: a newer push cancels the older run (both would push ci-screenshots).
concurrency:
  group: build-ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Engine unit tests (Swift, real sources)
        run: |
          set -o pipefail
          swiftc -O -o engine-tests Shared/Core/Geo.swift Shared/Core/Format.swift Shared/Core/Dates.swift \
            Shared/Services/Astro.swift Shared/Services/AuroraEngine.swift Shared/Services/SkyGlowGrid.swift Shared/Services/AuroraConfirm.swift Tests/EngineTests/main.swift 2>&1 | tee engine-tests.log
          ./engine-tests | tee -a engine-tests.log

      - name: Backend unit tests (Node)
        run: |
          npm ci --prefix backend --no-audit --no-fund
          node --test backend/test/*.test.mjs

      - name: Build app + widget (simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Nordur.xcodeproj \
            -target Nordur \
            -sdk iphonesimulator \
            -configuration Debug \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" | grep -v "^ld: warning" | head -400

      - name: Errors summary
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -200

      - name: iPhone build for Sideloadly / AltStore (unsigned .ipa)
        # Signed on the user's computer with their Apple ID (Sideloadly, AltStore):
        # see docs/INSTALLA.md. Built before the screenshots so a newer push that
        # cancels the run still leaves the .ipa.
        run: |
          set -o pipefail
          xcodebuild \
            -project Nordur.xcodeproj \
            -target Nordur \
            -sdk iphoneos \
            -configuration Release \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT=build-device \
            build 2>&1 | tee build-device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" | head -100
          mkdir -p Payload
          cp -R build-device/Release-iphoneos/Nordur.app Payload/
          zip -qry Nordur.ipa Payload
          ls -l Nordur.ipa

      - name: Publish the builds right away (ci-screenshots)
        # The .ipa and the Appetize zip are usable before the screenshots finish;
        # the last step republishes them together with the screenshots.
        env:
          TOKEN: ${{ github.token }}
        run: |
          (cd build/Debug-iphonesimulator && ditto -c -k --keepParent Nordur.app ../../Nordur-simulator.zip)
          rm -rf /tmp/early && mkdir -p /tmp/early && cp Nordur.ipa Nordur-simulator.zip /tmp/early/
          cd /tmp/early
          git init -q -b ci-screenshots
          git -c user.name=nordur-ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=nordur-ci -c user.email=ci@users.noreply.github.com commit -qm "Builds for ${GITHUB_SHA} (screenshots in progress)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-screenshots

      - name: Export strings for localization (XLIFF)
        run: |
          xcodebuild -exportLocalizations -project Nordur.xcodeproj -localizationPath loc -exportLanguage en > loc.log 2>&1 || tail -40 loc.log
          ls -R loc | head -20 || true

      - name: Tap test on the map and scroll to the bottom of every screen
        continue-on-error: true
        run: |
          brew tap facebook/fb >/dev/null
          brew trust facebook/fb 2>/dev/null || true
          brew install -q facebook/fb/idb-companion >/dev/null
          python3 -m pip install -q --break-system-packages fb-idb || pipx install fb-idb
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/Nordur.app
          xcrun simctl privacy "$UDID" grant location-always it.lorenzosavini.nordur || true
          idb_companion --udid "$UDID" > /tmp/idb.log 2>&1 &
          sleep 5
          idb connect localhost 10882 || idb connect "$UDID" || true
          # No -map.layer here: launch arguments would override what the taps save.
          xcrun simctl launch "$UDID" it.lorenzosavini.nordur -initialTab map -AppleLanguages "(it)" -AppleLocale it_IT
          sleep 20
          mkdir -p shots
          status=0
          python3 tools/ci/map_tap_test.py "$UDID" shots || status=$?
          python3 tools/ci/scroll_test.py "$UDID" shots || true
          xcrun simctl terminate "$UDID" it.lorenzosavini.nordur || true
          xcrun simctl uninstall "$UDID" it.lorenzosavini.nordur || true
          xcrun simctl shutdown "$UDID" || true
          exit $status

      - name: Run in the iPhone simulator and take screenshots
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Device $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 12:00 || true
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/Nordur.app
          xcrun simctl privacy "$UDID" grant location-always it.lorenzosavini.nordur || true
          xcrun simctl location "$UDID" set 63.4186,-19.0060 || true
          mkdir -p shots
          # name[:layer][@appearance][+language]; "s.<screen>" opens a secondary screen (-ciScreen) over Today.
          SHOTS="today@light today weather@light weather map:wind map:temperature@light map:precipitation map:cloud map:aurora map:radar
            drive@light trip@light kp@light kp kp:day@light kp:three@light kp:long@light aurora@light account@light
            s.alerts@light s.alertSettings@light s.info@light s.quakes@light s.roads@light s.transport@light s.webcams@light s.warnings@light s.offline@light
            today@light+en weather@light+en kp@light+en kp:day@light+en s.info@light+en"
          for shot in $SHOTS; do
            lang="it"; spec="$shot"; [ "${shot%+*}" != "$shot" ] && lang="${shot##*+}" && spec="${shot%+*}"
            base="${spec%%@*}"; mode="dark"; [ "$base" != "$spec" ] && mode="${spec#*@}"
            tab="${base%%:*}"; layer="${base#*:}"; [ "$layer" = "$base" ] && layer="wind"
            screen=""; [ "${tab#s.}" != "$tab" ] && screen="${tab#s.}" && tab="today"
            xcrun simctl launch "$UDID" it.lorenzosavini.nordur -initialTab "$tab" -ciScreen "$screen" -ciAlertsYellow YES -map.layer "$layer" -auroraMode "$layer" -appearance "$mode" \
              -AppleLanguages "($lang)" -AppleLocale "$([ "$lang" = en ] && echo en_GB || echo it_IT)"
            sleep 25
            xcrun simctl io "$UDID" screenshot "shots/$(echo "$shot" | tr ':@+' '---').png"
            if xcrun simctl spawn "$UDID" launchctl list | grep -q it.lorenzosavini.nordur; then
              echo "RUNNING after 25s: $shot" | tee -a shots/report.txt
            else
              echo "CRASHED or exited: $shot" | tee -a shots/report.txt
            fi
            xcrun simctl terminate "$UDID" it.lorenzosavini.nordur || true
            sleep 2
          done
          # Simulated drive on Route 1: Reykjavík → Hellisheiði → Hveragerði at ~90 km/h.
          xcrun simctl location "$UDID" start --speed=25 64.1300,-21.8000 64.0900,-21.6500 64.0400,-21.4500 64.0180,-21.3400 64.0100,-21.2000 64.0000,-21.1900 || true
          xcrun simctl launch "$UDID" it.lorenzosavini.nordur -initialTab drive -ciAutoDrive YES -AppleLanguages "(it)" -AppleLocale it_IT
          sleep 75
          xcrun simctl io "$UDID" screenshot "shots/drive-live.png"
          if xcrun simctl spawn "$UDID" launchctl list | grep -q it.lorenzosavini.nordur; then
            echo "RUNNING after 75s: drive-live" | tee -a shots/report.txt
          else
            echo "CRASHED or exited: drive-live" | tee -a shots/report.txt
          fi
          xcrun simctl location "$UDID" clear || true
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i nordur | tee -a shots/report.txt || true
          for f in ~/Library/Logs/DiagnosticReports/*Nordur*; do [ -f "$f" ] && head -120 "$f" > "shots/crash-$(basename "$f").txt"; done || true
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "Nordur" AND (messageType == error OR messageType == fault)' 2>/dev/null | tail -150 > shots/app-errors.txt || true
          cat shots/report.txt

      - name: Simulator build for Appetize or Xcode (zip)
        if: always()
        run: |
          [ -d build/Debug-iphonesimulator/Nordur.app ] || exit 0
          (cd build/Debug-iphonesimulator && ditto -c -k --keepParent Nordur.app ../../Nordur-simulator.zip)
          unzip -l Nordur-simulator.zip | head -5
          lipo -info build/Debug-iphonesimulator/Nordur.app/Nordur

      - name: Upload simulator build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nordur-simulator
          path: Nordur-simulator.zip
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload iPhone build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nordur-ipa
          path: Nordur.ipa
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish screenshots to branch ci-screenshots
        if: always()
        run: |
          mkdir -p shots
          cp build.log shots/ || true
          cp engine-tests.log shots/ || true
          find loc -name "*.xliff" -exec cp {} shots/strings-en.xliff \; 2>/dev/null || true
          # Single zip with Nordur.app at the root, for Appetize (workflow artifacts are zipped twice).
          cp Nordur-simulator.zip shots/ || true
          cp Nordur.ipa shots/ 2>/dev/null || true
          mv shots /tmp/shots
          git config user.name "nordur-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-screenshots
          git rm -rfq . || true
          cp /tmp/shots/* .
          git add -A
          git commit -qm "CI screenshots for ${GITHUB_SHA}"
          git push -f origin ci-screenshots
