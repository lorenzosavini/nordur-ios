name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build app + widget (simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Nordur.xcodeproj \
            -target Nordur \
            -sdk iphonesimulator \
            -configuration Debug \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" | grep -v "^ld: warning" | head -400

      - name: Errors summary
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -200

      - name: Run in the iPhone simulator and take screenshots
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Device $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 12:00 || true
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/Nordur.app
          xcrun simctl privacy "$UDID" grant location-always it.lorenzosavini.nordur || true
          xcrun simctl location "$UDID" set 63.4186,-19.0060 || true
          mkdir -p shots
          for shot in today@light today weather@light weather map:wind drive@light trip@light aurora account@light; do
            base="${shot%%@*}"; mode="dark"; [ "$base" != "$shot" ] && mode="${shot#*@}"
            tab="${base%%:*}"; layer="${base#*:}"; [ "$layer" = "$base" ] && layer="wind"
            xcrun simctl launch "$UDID" it.lorenzosavini.nordur -initialTab "$tab" -map.layer "$layer" -appearance "$mode"
            sleep 25
            xcrun simctl io "$UDID" screenshot "shots/$(echo "$shot" | tr ':@' '--').png"
            if xcrun simctl spawn "$UDID" launchctl list | grep -q it.lorenzosavini.nordur; then
              echo "RUNNING after 25s: $shot" | tee -a shots/report.txt
            else
              echo "CRASHED or exited: $shot" | tee -a shots/report.txt
            fi
            xcrun simctl terminate "$UDID" it.lorenzosavini.nordur || true
            sleep 2
          done
          # Simulated drive on Route 1: Reykjavík → Hellisheiði → Hveragerði at ~90 km/h.
          xcrun simctl location "$UDID" start --speed=25 64.1300,-21.8000 64.0900,-21.6500 64.0400,-21.4500 64.0180,-21.3400 64.0100,-21.2000 64.0000,-21.1900 || true
          xcrun simctl launch "$UDID" it.lorenzosavini.nordur -initialTab drive -ciAutoDrive YES
          sleep 75
          xcrun simctl io "$UDID" screenshot "shots/drive-live.png"
          if xcrun simctl spawn "$UDID" launchctl list | grep -q it.lorenzosavini.nordur; then
            echo "RUNNING after 75s: drive-live" | tee -a shots/report.txt
          else
            echo "CRASHED or exited: drive-live" | tee -a shots/report.txt
          fi
          xcrun simctl location "$UDID" clear || true
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i nordur | tee -a shots/report.txt || true
          for f in ~/Library/Logs/DiagnosticReports/*Nordur*; do [ -f "$f" ] && head -120 "$f" > "shots/crash-$(basename "$f").txt"; done || true
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "Nordur" AND (messageType == error OR messageType == fault)' 2>/dev/null | tail -150 > shots/app-errors.txt || true
          cat shots/report.txt

      - name: Publish screenshots to branch ci-screenshots
        if: always()
        run: |
          [ -d shots ] || exit 0
          cp build.log shots/ || true
          mv shots /tmp/shots
          git config user.name "nordur-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-screenshots
          git rm -rfq . || true
          cp /tmp/shots/* .
          git add -A
          git commit -qm "CI screenshots for ${GITHUB_SHA}"
          git push -f origin ci-screenshots
