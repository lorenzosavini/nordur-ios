name: Build iOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          ls /Applications | grep -i xcode || true
          xcodebuild -version
          xcrun simctl list runtimes | head -20

      - name: Build app + widget (simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Nordur.xcodeproj \
            -target Nordur \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated)?|BUILD (SUCCEEDED|FAILED)" | grep -v "^ld: warning" | head -400

      - name: Errors summary
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -200

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
