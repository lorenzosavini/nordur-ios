name: Simulators

# Run by hand: lists the Xcode versions, runtimes and device types on each runner image.
on:
  workflow_dispatch:

jobs:
  list:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-26, macos-26-xlarge, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - run: |
          ls /Applications | grep -i xcode
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -i -E "duo|fold|iphone 18|resizable" || echo "no Duo device type"
