name: Flyover test

# Run by hand: makes the 3D route picture and flight of the demo drive in the
# simulator and publishes them to the branch flyover.
on:
  workflow_dispatch:
    inputs:
      lang:
        description: "Language of the card (it, en, de, fr, es)"
        default: "it"
      routes:
        description: "Routes in tools/ci/routes to fly, comma separated (empty: the demo drive)"
        default: ""

permissions:
  contents: write

jobs:
  flyover:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build the app (simulator)
        run: |
          set -o pipefail
          xcodebuild -project Nordur.xcodeproj -target Nordur -sdk iphonesimulator -configuration Debug \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|warning: .*RouteFlyover|BUILD (SUCCEEDED|FAILED)"
      - name: Render
        run: |
          LANG_IN="${{ github.event.inputs.lang || 'it' }}"
          case "$LANG_IN" in en) LOCALE=en_GB;; de) LOCALE=de_DE;; fr) LOCALE=fr_FR;; es) LOCALE=es_ES;; *) LOCALE=it_IT;; esac
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']))")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/Nordur.app
          ROUTES="${{ github.event.inputs.routes }}"
          mkdir -p out
          if [ -z "$ROUTES" ]; then
            xcrun simctl launch "$UDID" it.lorenzosavini.nordur -initialTab trip -ciDemoTrip YES -ciFlyover YES -AppleLanguages "($LANG_IN)" -AppleLocale "$LOCALE"
            DOCS="$(xcrun simctl get_app_container "$UDID" it.lorenzosavini.nordur data)/Documents"
            for i in $(seq 1 120); do [ -f "$DOCS/flyover.txt" ] && break; sleep 10; done
            cat "$DOCS/flyover.txt" | tee out/result.txt || echo "no result" | tee out/result.txt
            cp "$DOCS"/flyover.* out/ 2>/dev/null || true
          else
            # Famous drives (tools/ci/routes/*.gpx), one launch each.
            xcrun simctl launch "$UDID" it.lorenzosavini.nordur -initialTab trip -AppleLanguages "($LANG_IN)" -AppleLocale "$LOCALE"; sleep 15
            DOCS="$(xcrun simctl get_app_container "$UDID" it.lorenzosavini.nordur data)/Documents"
            for R in ${ROUTES//,/ }; do
              cp "tools/ci/routes/$R.gpx" "$DOCS/"
              xcrun simctl terminate "$UDID" it.lorenzosavini.nordur || true; sleep 2
              xcrun simctl launch "$UDID" it.lorenzosavini.nordur -initialTab trip -ciFlyover YES -ciFlyoverGPX "$R" -AppleLanguages "($LANG_IN)" -AppleLocale "$LOCALE"
              for i in $(seq 1 90); do [ -f "$DOCS/flyover-$R.txt" ] && break; sleep 10; done
              echo "$R: $(cat "$DOCS/flyover-$R.txt" 2>/dev/null || echo 'no result')" | tee -a out/result.txt
              cp "$DOCS/flyover-$R.mp4" out/ 2>/dev/null || true
            done
          fi
          ls -la out
      - name: Publish to branch flyover
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b flyover
          git add -A
          git -c user.name=nordur-ci -c user.email=ci@users.noreply.github.com commit -qm "Flyover for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:flyover
