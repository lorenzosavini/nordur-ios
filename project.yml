# Alternativa al progetto incluso: `brew install xcodegen && xcodegen generate`
name: Nordur
options:
  bundleIdPrefix: it.lorenzosavini
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
targets:
  Nordur:
    type: application
    platform: iOS
    sources:
      - path: Nordur
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Norður
        LSApplicationCategoryType: public.app-category.travel
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Norður usa la tua posizione per mostrarti meteo, allerte, strade e probabilità di aurora dove ti trovi.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [it.lorenzosavini.nordur.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.lorenzosavini.nordur
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
