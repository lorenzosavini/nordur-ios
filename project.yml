# Alternativa al progetto incluso: `brew install xcodegen && xcodegen generate`
name: Nordur
options:
  bundleIdPrefix: it.lorenzosavini
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1"
targets:
  Nordur:
    type: application
    platform: iOS
    sources:
      - path: Nordur
      - path: Shared
    dependencies:
      - target: NordurWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.lorenzosavini.nordur
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Nordur.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Norður
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  NordurWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NordurWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.lorenzosavini.nordur.widgets
        INFOPLIST_FILE: NordurWidgets-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Norður
        SKIP_INSTALL: YES
